services:
  - type: web
    name: telegram-vc-music-bot
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: API_ID
        value: "37612844"
      - key: OWNER_ID
        value: "6757694588"
      - key: LOG_CHAT_ID
        value: "-1003865437365"
      - key: ALLOWED_CHAT_ID
        value: "0"
      - key: PORT
        value: "8080"
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: SESSION_STRING
        sync: false
